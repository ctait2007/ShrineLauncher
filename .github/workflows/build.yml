  cat > 'app/src/main/res/layout/activity_settings.xml' << 'FILEOF'
<?xml version="1.0" encoding="utf-8"?>
<ScrollView
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="match_parent"
    android:background="@color/bg_dark"
    android:fillViewport="true">

    <LinearLayout
        android:layout_width="match_parent"
        android:layout_height="wrap_content"
        android:orientation="vertical"
        android:padding="24dp">

        <!-- Header -->
        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="horizontal"
            android:gravity="center_vertical"
            android:layout_marginBottom="24dp">

            <ImageButton
                android:id="@+id/btnBack"
                android:layout_width="40dp"
                android:layout_height="40dp"
                android:src="@drawable/ic_arrow_back"
                android:background="@drawable/bg_icon_btn"
                android:tint="@color/text_primary"
                android:contentDescription="Back"
                android:focusable="true" />

            <TextView
                android:layout_width="0dp"
                android:layout_height="wrap_content"
                android:layout_weight="1"
                android:layout_marginStart="12dp"
                android:text="Settings"
                android:textColor="@color/text_primary"
                android:textSize="22sp"
                android:textStyle="bold" />
        </LinearLayout>

        <!-- ── ROWS SECTION ──────────────────────────────────── -->
        <TextView style="@style/SectionHeader" android:text="Home Screen Rows" />

        <androidx.recyclerview.widget.RecyclerView
            android:id="@+id/rvRows"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:nestedScrollingEnabled="false" />

        <Button
            android:id="@+id/btnAddRow"
            style="@style/SecondaryButton"
            android:layout_marginTop="8dp"
            android:text="+ Add Row" />

        <View style="@style/Divider" />

        <!-- ── WIDGETS SECTION ──────────────────────────────── -->
        <TextView style="@style/SectionHeader" android:text="Pinned Widgets" />

        <TextView
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:text="Widgets appear above your rows (e.g. Continue Watching)"
            android:textColor="@color/text_secondary"
            android:textSize="12sp"
            android:layout_marginBottom="8dp" />

        <androidx.recyclerview.widget.RecyclerView
            android:id="@+id/rvWidgets"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:nestedScrollingEnabled="false" />

        <Button
            android:id="@+id/btnAddWidget"
            style="@style/SecondaryButton"
            android:layout_marginTop="8dp"
            android:text="+ Pin Widget" />

        <View style="@style/Divider" />

        <!-- ── THEME SECTION ────────────────────────────────── -->
        <TextView style="@style/SectionHeader" android:text="Theme" />

        <TextView style="@style/FieldLabel" android:text="Accent Colour (hex)" />
        <EditText
            android:id="@+id/etAccentColor"
            style="@style/SettingsInput"
            android:hint="#E040FB" />

        <TextView style="@style/FieldLabel" android:text="Background Colour (hex)" />
        <EditText
            android:id="@+id/etBgColor"
            style="@style/SettingsInput"
            android:hint="#0D0D0D" />

        <LinearLayout style="@style/SwitchRow">
            <TextView style="@style/SwitchLabel" android:text="Dynamic Colour" />
            <Switch android:id="@+id/switchDynamicColor"
                android:layout_width="wrap_content" android:layout_height="wrap_content" />
        </LinearLayout>

        <TextView style="@style/FieldLabel" android:text="Background Dim (0-100)" />
        <SeekBar android:id="@+id/sbBackgroundDim"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:max="100" android:layout_marginBottom="8dp" />

        <TextView style="@style/FieldLabel" android:text="Background Blur (0-25)" />
        <SeekBar android:id="@+id/sbBackgroundBlur"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:max="25" android:layout_marginBottom="12dp" />

        <Button android:id="@+id/btnSaveTheme" style="@style/PrimaryButton" android:text="Save Theme" />

        <View style="@style/Divider" />

        <!-- ── APPEARANCE ────────────────────────────────────── -->
        <TextView style="@style/SectionHeader" android:text="Appearance" />

        <TextView style="@style/FieldLabel" android:text="Icon Size (48–144 dp)" />
        <SeekBar android:id="@+id/sbIconSize"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:max="96" android:layout_marginBottom="8dp" />

        <LinearLayout style="@style/SwitchRow">
            <TextView style="@style/SwitchLabel" android:text="Focus Scale Effect" />
            <Switch android:id="@+id/switchFocusScale"
                android:layout_width="wrap_content" android:layout_height="wrap_content" />
        </LinearLayout>

        <LinearLayout style="@style/SwitchRow">
            <TextView style="@style/SwitchLabel" android:text="Animations" />
            <Switch android:id="@+id/switchAnimations"
                android:layout_width="wrap_content" android:layout_height="wrap_content" />
        </LinearLayout>

        <TextView style="@style/FieldLabel" android:text="Card Style" />
        <Spinner android:id="@+id/spinnerCardStyle"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:layout_marginBottom="8dp" />

        <TextView style="@style/FieldLabel" android:text="Row Label Style" />
        <Spinner android:id="@+id/spinnerRowLabelStyle"
            android:layout_width="match_parent" android:layout_height="wrap_content"
            android:layout_marginBottom="12dp" />

        <Button android:id="@+id/btnSaveAppearance" style="@style/PrimaryButton" android:text="Save Appearance" />

        <View style="@style/Divider" />

        <!-- ── CLOCK ────────────────────────────────────────── -->
        <TextView style="@style/SectionHeader" android:text="Clock" />

        <LinearLayout style="@style/SwitchRow">
            <TextView style="@style/SwitchLabel" android:text="Show Clock" />
            <Switch android:id="@+id/switchClock"
                android:layout_width="wrap_content" android:layout_height="wrap_content" />
        </LinearLayout>

        <LinearLayout style="@style/SwitchRow">
            <TextView style="@style/SwitchLabel" android:text="24-hour Format" />
            <Switch android:id="@+id/switch24h"
                android:layout_width="wrap_content" android:layout_height="wrap_content" />
        </LinearLayout>

        <Button android:id="@+id/btnSaveClock" style="@style/PrimaryButton" android:text="Save Clock" />

    </LinearLayout>
</ScrollView>

