<?xml version="1.0" encoding="utf-8"?>
<FrameLayout
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="wrap_content"
    android:layout_height="wrap_content"
    android:layout_marginHorizontal="6dp">

    <LinearLayout
        android:id="@+id/cwCardRoot"
        android:layout_width="180dp"
        android:layout_height="120dp"
        android:orientation="vertical"
        android:focusable="true"
        android:clickable="true"
        android:background="@drawable/bg_cw_card"
        android:foreground="@drawable/selector_focus_ring">

        <!-- Artwork -->
        <FrameLayout
            android:layout_width="match_parent"
            android:layout_height="0dp"
            android:layout_weight="1">

            <ImageView
                android:id="@+id/ivCwArtwork"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:scaleType="centerCrop"
                android:src="@drawable/bg_card_placeholder" />

            <!-- Remove button -->
            <ImageButton
                android:id="@+id/btnCwRemove"
                android:layout_width="24dp"
                android:layout_height="24dp"
                android:layout_gravity="top|end"
                android:layout_margin="4dp"
                android:src="@drawable/ic_close"
                android:background="@drawable/bg_remove_btn"
                android:contentDescription="Remove"
                android:visibility="gone"
                android:tint="@color/text_primary" />
        </FrameLayout>

        <!-- Info bar -->
        <LinearLayout
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:background="#CC000000"
            android:paddingHorizontal="8dp"
            android:paddingTop="4dp"
            android:paddingBottom="2dp">

            <TextView
                android:id="@+id/tvCwTitle"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textColor="@color/text_primary"
                android:textSize="11sp"
                android:textStyle="bold"
                android:maxLines="1"
                android:ellipsize="end" />

            <TextView
                android:id="@+id/tvCwSubtitle"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:textColor="@color/text_secondary"
                android:textSize="9sp"
                android:maxLines="1"
                android:ellipsize="end" />

            <ProgressBar
                android:id="@+id/pbCwProgress"
                style="@android:style/Widget.ProgressBar.Horizontal"
                android:layout_width="match_parent"
                android:layout_height="3dp"
                android:layout_marginTop="3dp"
                android:progressTint="@color/accent"
                android:progressBackgroundTint="#44FFFFFF"
                android:max="100"
                android:progress="0"
                android:visibility="gone" />
        </LinearLayout>
    </LinearLayout>

</FrameLayout>

