<?xml version="1.0" encoding="utf-8"?>
<!-- item_settings_row.xml -->
<LinearLayout
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
    android:layout_height="wrap_content"
    android:orientation="horizontal"
    android:gravity="center_vertical"
    android:paddingVertical="10dp"
    android:paddingHorizontal="4dp">

    <LinearLayout
        android:layout_width="0dp"
        android:layout_height="wrap_content"
        android:layout_weight="1"
        android:orientation="vertical">

        <TextView
            android:id="@+id/tvSettingsRowName"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:textColor="@color/text_primary"
            android:textSize="14sp" />

        <TextView
            android:id="@+id/tvSettingsRowType"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:textColor="@color/text_secondary"
            android:textSize="11sp" />
    </LinearLayout>

    <ImageButton
        android:id="@+id/btnToggleVisibility"
        android:layout_width="36dp"
        android:layout_height="36dp"
        android:src="@drawable/ic_visibility_on"
        android:background="@android:color/transparent"
        android:tint="@color/text_secondary"
        android:contentDescription="Toggle visibility" />

    <ImageButton
        android:id="@+id/btnEditRow"
        android:layout_width="36dp"
        android:layout_height="36dp"
        android:src="@drawable/ic_edit"
        android:background="@android:color/transparent"
        android:tint="@color/text_secondary"
        android:contentDescription="Edit" />

    <ImageButton
        android:id="@+id/btnDeleteRow"
        android:layout_width="36dp"
        android:layout_height="36dp"
        android:src="@drawable/ic_delete"
        android:background="@android:color/transparent"
        android:tint="#EF5350"
        android:contentDescription="Delete" />

</LinearLayout>

