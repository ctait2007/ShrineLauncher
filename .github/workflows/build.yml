name: Build Shrine Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Set up signing keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 -d > shrine-debug.jks

      - name: Download Gradle wrapper jar
        run: |
          curl -sL "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Write image assets
        run: python3 .github/assets_setup.py

      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon --build-cache \
            -Pandroid.injected.signing.store.file=$PWD/shrine-debug.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=shrine \
            -Pandroid.injected.signing.key.password=android

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Shrine Launcher v${{ steps.version.outputs.VERSION }}
          body: |
            Shrine Launcher v${{ steps.version.outputs.VERSION }}
            Install over any previous version.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
