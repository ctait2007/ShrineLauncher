        fun bind(widget: PinnedWidget) {
            tvName.text = widget.title
            tvType.text = widget.type.name.replace('"'"'_'"'"', '"'"' '"'"')
            btnDel.setOnClickListener { onRemove(widget) }
        }
    }
}

