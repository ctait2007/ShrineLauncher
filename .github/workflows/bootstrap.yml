name: Bootstrap - Unzip and Commit Project

on:
  push:
    paths:
      - 'ShrineLauncher.zip'

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project (excluding workflows)
        run: |
          unzip -o ShrineLauncher.zip
          cp -r ShrineLauncher/. .
          rm -rf ShrineLauncher
          rm ShrineLauncher.zip
          # Remove the workflows folder from the unzipped content
          # so we don't conflict with existing workflow files
          rm -rf .github/workflows/build.yml

      - name: Commit all project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -A
          git commit -m "Bootstrap: unzip and add project files"
          git push
